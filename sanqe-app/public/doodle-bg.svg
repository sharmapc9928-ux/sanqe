<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <g fill="none" stroke="#7b86a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- open book -->
    <g transform="translate(40,70)">
      <path d="M0 8 C16 -2 34 -2 50 8 L50 52 C34 42 16 42 0 52 Z" />
      <path d="M100 8 C84 -2 66 -2 50 8 L50 52 C66 42 84 42 100 52 Z" />
      <path d="M8 16 C20 10 32 10 42 16" stroke-width="1.1" opacity="0.7"/>
      <path d="M8 26 C20 20 32 20 42 26" stroke-width="1.1" opacity="0.7"/>
      <path d="M58 16 C68 10 80 10 92 16" stroke-width="1.1" opacity="0.7"/>
      <path d="M58 26 C68 20 80 20 92 26" stroke-width="1.1" opacity="0.7"/>
    </g>

    <!-- pencil -->
    <g transform="translate(300,36) rotate(32)">
      <rect x="0" y="0" width="64" height="11" rx="2" />
      <path d="M64 0 L78 5.5 L64 11 Z" />
      <line x1="12" y1="0" x2="12" y2="11" />
      <line x1="4" y1="2" x2="4" y2="9" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- graduation cap -->
    <g transform="translate(160,150)">
      <path d="M0 0 L34 -15 L68 0 L34 15 Z" />
      <path d="M16 6 L16 24 C16 31 52 31 52 24 L52 6" />
      <line x1="62" y1="3" x2="62" y2="27" />
      <circle cx="62" cy="30" r="2.4" />
    </g>

    <!-- ruler -->
    <g transform="translate(330,190) rotate(-18)">
      <rect x="0" y="0" width="80" height="16" rx="2" />
      <line x1="10" y1="0" x2="10" y2="7" stroke-width="1"/>
      <line x1="20" y1="0" x2="20" y2="7" stroke-width="1"/>
      <line x1="30" y1="0" x2="30" y2="7" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="7" stroke-width="1"/>
      <line x1="50" y1="0" x2="50" y2="7" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="7" stroke-width="1"/>
      <line x1="70" y1="0" x2="70" y2="7" stroke-width="1"/>
    </g>

    <!-- light bulb -->
    <g transform="translate(90,330)">
      <circle cx="0" cy="0" r="18" />
      <path d="M-7 18 L7 18" />
      <path d="M-5 24 L5 24" />
      <path d="M-5 -18 L-5 -26" stroke-width="1.2"/>
      <path d="M5 -18 L5 -26" stroke-width="1.2"/>
      <path d="M0 -20 L0 -30" stroke-width="1.2"/>
    </g>

    <!-- alarm clock -->
    <g transform="translate(360,380)">
      <circle cx="0" cy="0" r="22" />
      <line x1="0" y1="0" x2="0" y2="-12" />
      <line x1="0" y1="0" x2="9" y2="4" />
      <line x1="-7" y1="-24" x2="-14" y2="-32" />
      <line x1="7" y1="-24" x2="14" y2="-32" />
    </g>

    <!-- paperclip -->
    <g transform="translate(410,70) rotate(18)">
      <path d="M0 0 C0 -14 20 -14 20 0 L20 30 C20 40 6 40 6 30 L6 10" />
    </g>

    <!-- squiggle underline -->
    <path d="M20 450 C30 440 40 460 50 450 C60 440 70 460 80 450" stroke-width="1.3" opacity="0.8" />

    <!-- scribble asterisk -->
    <g transform="translate(250,420)" stroke-width="1.3">
      <line x1="-8" y1="0" x2="8" y2="0" />
      <line x1="0" y1="-8" x2="0" y2="8" />
      <line x1="-6" y1="-6" x2="6" y2="6" />
      <line x1="-6" y1="6" x2="6" y2="-6" />
    </g>
  </g>

  <text x="200" y="265" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#7b86a8">&#960;</text>
  <text x="420" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#7b86a8">&#8721;</text>
  <text x="250" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#7b86a8">%</text>
  <text x="30" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#7b86a8">&#247;</text>
</svg>
